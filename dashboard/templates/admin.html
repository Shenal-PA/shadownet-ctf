{% extends "base.html" %}

{% block title %}Admin Portal - ShadowNet CTF{% endblock %}

{% block content %}
<h2>Admin Dashboard</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
    <div class="card" style="text-align: center;">
        <h3 style="margin: 0; font-size: 2rem; color: var(--accent-color);">{{ total_users }}</h3>
        <p style="margin: 0.5rem 0 0 0; color: #8b949e;">Total Users</p>
    </div>
    <div class="card" style="text-align: center;">
        <h3 style="margin: 0; font-size: 2rem; color: var(--success-color);">{{ total_submissions }}</h3>
        <p style="margin: 0.5rem 0 0 0; color: #8b949e;">Correct Submissions</p>
    </div>
    <div class="card" style="text-align: center;">
        <h3 style="margin: 0; font-size: 2rem; color: var(--warning-color);">{{ total_challenges }}</h3>
        <p style="margin: 0.5rem 0 0 0; color: #8b949e;">Active Challenges</p>
    </div>
</div>

<div class="card">
    <h3>Admin Controls</h3>
    <button onclick="resetScores()" style="background-color: var(--danger-color);">Reset All Scores</button>
    <div id="admin-msg" style="margin-top: 1rem;"></div>
</div>

<script>
function resetScores() {
    if (!confirm("Are you sure you want to reset all scores and submission history?")) return;
    fetch('/admin/reset_all', { method: 'POST' })
    .then(res => res.json())
    .then(data => {
        document.getElementById('admin-msg').innerHTML = `<div class="alert alert-success">${data.message}</div>`;
    });
}
</script>
{% endblock %}
