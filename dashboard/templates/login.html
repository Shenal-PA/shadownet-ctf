{% extends "base.html" %}

{% block title %}Login - ShadowNet CTF{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 3rem auto;">
    <h2>Login</h2>
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('login') }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
        
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        
        <button type="submit" style="width: 100%;">Sign In</button>
    </form>
    <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--accent-color);">Register here</a>
    </p>
</div>
{% endblock %}
