{% extends "base.html" %}

{% block title %}Register - ShadowNet CTF{% endblock %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 3rem auto;">
    <h2>Register Account</h2>
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('register') }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
        
        <label for="email">Email (optional)</label>
        <input type="email" id="email" name="email">

        <label for="team_name">Team Name (optional)</label>
        <input type="text" id="team_name" name="team_name">
        
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        
        <button type="submit" style="width: 100%;">Create Account</button>
    </form>
    <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
        Already registered? <a href="{{ url_for('login') }}" style="color: var(--accent-color);">Login here</a>
    </p>
</div>
{% endblock %}
